spring.application.name=tarea4

# Puerto del servidor
server.port=8080

# Desactivar la caché de Thymeleaf en desarrollo (se ven los cambios al recargar)
spring.thymeleaf.cache=false

# Base de datos MySQL: el MISMO esquema "tarea2" de las tareas previas.
# Usuario/clave pedidos por el enunciado (ver README).
spring.datasource.url=jdbc:mysql://localhost:3306/tarea2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=cc5002
spring.datasource.password=programacionweb

# El esquema ya existe (creado con los scripts SQL). Hibernate no lo toca.
spring.jpa.hibernate.ddl-auto=none

# Deja abierta la sesión durante la petición para leer relaciones perezosas
# (horarios y notas) al armar los resultados. También se cubre con @Transactional.
spring.jpa.open-in-view=true
